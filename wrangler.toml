# Cloudflare Workers config. Cloudflare builds with `bun run build`, then `npx wrangler deploy` uploads dist/ (the
# app) and worker.ts (the /api server). Secrets and settings are added in the Cloudflare dashboard, not here.
name = "job-application-tracker-2-0"
main = "worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
# Keep variables added in the Cloudflare dashboard; without this every deploy deletes the plain-text ones.
keep_vars = true

[vars]
NODE_ENV = "production"

[assets]
directory = "./dist"
# Any page that isn't a file (e.g. /#capture links) gets index.html, like a normal single-page app.
not_found_handling = "single-page-application"
# Only API calls run code; everything else is served straight from dist/.
run_worker_first = ["/api/*"]

[observability]
enabled = true
