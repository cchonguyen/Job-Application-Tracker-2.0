# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: job-application-tracker
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Public anon/publishable key. Users sign in with Google via Supabase Auth; row-level security scopes their data.
      - key: SUPABASE_ANON_KEY
        sync: false
      # Optional: jobs each user can add by link or pasted text per day (default 30; 0 turns the limit off).
      - key: EXTRACTION_DAILY_LIMIT
        sync: false
