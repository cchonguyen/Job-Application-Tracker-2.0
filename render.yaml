# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: job-application-tracker
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Required in production: every /api call must present this key (the app prompts for it once per browser).
      - key: API_ACCESS_KEY
        generateValue: true
