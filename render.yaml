# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: job-application-tracker
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Public anon/publishable key. Users sign in with Google via Supabase Auth; row-level security scopes their data.
      - key: SUPABASE_ANON_KEY
        sync: false
      # Optional but recommended: the Google OAuth client ID also entered in Supabase's Google provider. With it,
      # Google's account chooser names this app instead of the Supabase project.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # Optional: Gemini extractions each user can run per UTC day (default 30; 0 turns the limit off).
      - key: EXTRACTION_DAILY_LIMIT
        sync: false
