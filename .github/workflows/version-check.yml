name: Version bump

on:
  pull_request:
    branches: [main]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require package.json version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-bump.mjs "origin/$BASE_REF"
