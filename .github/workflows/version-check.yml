name: Version bump

on:
  pull_request:
    branches: [main]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require package.json version bump
        run: node scripts/check-version-bump.mjs origin/${{ github.base_ref }}
